name: Web Production

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-production.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-production.yml'
  schedule:
    # Daily sanity check that production is reachable
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Production build
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_ci_placeholder' }}

  verify-production:
    name: Verify production deployment
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      deployments: read
      contents: read
    steps:
      - name: Wait for Vercel deployment
        run: sleep 180

      - name: Confirm Vercel deployed this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 10); do
            deployment_id=$(gh api "repos/$REPO/deployments" \
              --jq ".[] | select(.sha == \"$SHA\" and .environment == \"Production\") | .id" \
              | head -n 1)

            if [ -z "$deployment_id" ]; then
              echo "Attempt $attempt: no production deployment for $SHA yet"
              sleep 30
              continue
            fi

            state=$(gh api "repos/$REPO/deployments/$deployment_id/statuses" \
              --jq '.[0].state')

            echo "Production deployment $deployment_id -> $state"

            if [ "$state" = "success" ]; then
              exit 0
            fi

            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              description=$(gh api "repos/$REPO/deployments/$deployment_id/statuses" \
                --jq '.[0].description')
              echo "Vercel deployment failed: $description"
              exit 1
            fi

            sleep 30
          done

          echo "Timed out waiting for a successful production deployment for $SHA"
          exit 1

      - name: Check production URLs
        run: |
          for url in https://www.cardoncue.com https://cardoncue.com; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> HTTP $status"
            if [ "$status" != "200" ]; then
              echo "Production check failed for $url"
              exit 1
            fi
          done

  production-health:
    name: Production health check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check production URLs
        run: |
          for url in https://www.cardoncue.com https://cardoncue.com; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> HTTP $status"
            if [ "$status" != "200" ]; then
              echo "Production check failed for $url"
              exit 1
            fi
          done
