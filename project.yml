name: CardOnCue

options:
  bundleIdPrefix: com.nathanfennel
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en

packages:
  QRCodeGenerator:
    url: https://github.com/dagronf/swift-qrcode-generator
    from: 2.0.2

settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  CardOnCue:
    type: application
    platform: iOS
    sources:
      - path: CardOnCue
        excludes:
          - "*.md"
          - "Preview Content"
      - path: CardOnCue/Assets.xcassets
    resources:
      - path: CardOnCue/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanfennel.CardOnCue
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CardOnCue/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - target: CardOnCue Watch App
        embed: true
    scheme:
      testTargets:
        - CardOnCueTests
        - CardOnCueUITests
    preBuildScripts: []
    postBuildScripts: []

  CardOnCue Watch App:
    type: application
    platform: watchOS
    sources:
      - path: "CardOnCue Watch App"
        excludes:
          - "*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanfennel.CardOnCue.watchkitapp
        INFOPLIST_FILE: "CardOnCue Watch App/Info.plist"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: true
        WK_APPLICATION_BUNDLE_IDENTIFIER: com.nathanfennel.CardOnCue
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: QRCodeGenerator
    scheme: {}

  CardOnCueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CardOnCueTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanfennel.CardOnCueTests
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CardOnCue

  CardOnCueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CardOnCueUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanfennel.CardOnCueUITests
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: CardOnCue
    dependencies:
      - target: CardOnCue

schemes:
  CardOnCue:
    build:
      targets:
        CardOnCue: all
        CardOnCue Watch App: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CardOnCueTests
        - CardOnCueUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
